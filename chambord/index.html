<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chambord · Terminal</title>
<style>
:root{--bg:#121315;--panel:#1b1d20;--line:#33363b;--ink:#e9e6df;--mute:#a19c92;--acc:#c9a45c;--ok:#7fb48a;--bad:#d77a6a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"DejaVu Serif",serif;font-size:16px;line-height:1.5}
header{padding:18px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:900px;margin:0 auto}
header h1{margin:0;font-size:1.35rem;font-weight:normal;letter-spacing:.06em;text-transform:uppercase}
header .sub{color:var(--mute);font-size:.82rem;font-family:system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.lang{background:none;border:1px solid var(--line);color:var(--mute);border-radius:4px;padding:4px 10px;font-family:system-ui,sans-serif;font-size:.8rem}
nav{display:flex;gap:2px;max-width:900px;margin:0 auto;padding:0 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;color:var(--mute);padding:12px 12px;font-family:system-ui,sans-serif;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 16px}
.warn{color:var(--acc)}
.codebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.codebox input{font:inherit;font-size:1.8rem;letter-spacing:.5em;width:8.2em;text-align:center;background:#0c0d0e;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 6px 8px 14px}
.btn{background:var(--acc);color:#14120d;border:none;border-radius:6px;padding:12px 20px;font-family:system-ui,sans-serif;font-weight:600}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);font-weight:normal}
.msg{margin-top:14px;padding:14px 16px;border-left:3px solid var(--line);font-style:italic;min-height:1em}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
.msg:empty{display:none}
.phone{width:min(320px,100%);margin:0 auto;border:2px solid #44474d;border-radius:34px;padding:18px 14px 26px;background:#0b0c0d}
.phone .notch{width:90px;height:6px;background:#2a2c30;border-radius:4px;margin:0 auto 18px}
.phone .scr{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.phone .scr input{font:inherit;font-size:1.6rem;letter-spacing:.45em;width:7em;text-align:center;background:#000;color:#fff;border:1px solid #333;border-radius:8px;padding:6px 4px 6px 12px}
.bubble{align-self:flex-end;background:#2f5d8a;color:#fff;border-radius:16px 16px 4px 16px;padding:9px 12px;max-width:85%;text-align:left;font-family:system-ui,sans-serif;font-size:.9rem}
.bubble.in{align-self:flex-start;background:#2d2f33;border-radius:16px 16px 16px 4px}
.meta{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--mute)}
.thread{width:100%;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.daylist{display:grid;gap:10px}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.dayrow .st{font-family:system-ui,sans-serif;font-size:.82rem;color:var(--mute)}
.dayrow.open .st{color:var(--ok)}
iframe.doss{width:100%;border:0;background:#fff;border-radius:4px;margin-top:12px;display:block}
.grid{width:100%;border-collapse:collapse;font-size:.92rem}
.grid td{border-top:1px solid var(--line);padding:10px 6px;vertical-align:top}
.grid td:first-child{font-weight:bold;width:22%}
.grid select{font:inherit;background:#0c0d0e;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px}
.total{font-size:2.2rem;text-align:center;margin:10px 0 0;color:var(--acc)}
.small{font-size:.85rem;color:var(--mute)}
footer{max-width:900px;margin:0 auto;padding:0 16px 30px}
@media (max-width:560px){.grid td:first-child{width:auto}header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div><h1 id="t"></h1><div class="sub" id="st"></div></div><button class="lang" id="lg"></button></header>
<nav id="nav"></nav>
<main>
 <section class="view" id="v0"><div class="card" id="home"></div></section>
 <section class="view" id="v1"><div class="card"><p id="ask"></p><div class="codebox"><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" id="go"></button></div><div class="msg" id="cmsg"></div></div></section>
 <section class="view" id="v2"><div class="phone"><div class="notch"></div><div class="scr" id="pscr"></div></div></section>
 <section class="view" id="v3"><div class="daylist" id="days"></div><div id="dview"></div></section>
 <section class="view" id="v4"><div id="theory"></div></section>
</main>
<footer><button class="btn ghost" id="rst"></button></footer>
<script>

-width=\"1\" x1=\"11.0\" x2=\"16.544\" y1=\"11.0\" y2=\"11.0\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"13.772000000000002\" y1=\"11.0\" y2=\"15.801244838580928\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"8.228000000000002\" y1=\"11.0\" y2=\"15.801244838580928\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"5.4559999999999995\" y1=\"11.0\" y2=\"11.0\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"8.227999999999998\" y1=\"11.0\" y2=\"6.198755161419074\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"13.772000000000002\" y1=\"11.0\" y2=\"6.198755161419072\"></line></svg> plante</span> <span class=\"li\"><svg style=\"display:inline-block;vertical-align:middle\" viewbox=\"0 0 22 22\" width=\"14pt\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#c9c9c9\" height=\"19\" width=\"19\" x=\"1.5\" y=\"1.5\"></rect><rect fill=\"#fff\" height=\"9.856000000000002\" stroke=\"#000\" stroke-width=\"1.4\" width=\"14.783999999999999\" x=\"3.6080000000000005\" y=\"6.071999999999999\"></rect></svg> table</span> <span class=\"li\"><svg style=\"display:inline-block;vertical-align:middle\" viewbox=\"0 0 22 22\" width=\"14pt\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#c9c9c9\" height=\"19\" width=\"19\" x=\"1.5\" y=\"1.5\"></rect><ellipse cx=\"11.0\" cy=\"11.0\" fill=\"#fff\" rx=\"6.16\" ry=\"7.084\" stroke=\"#000\" stroke-width=\"1.4\"></ellipse><line stroke=\"#000\" x1=\"4.84\" x2=\"17.16\" y1=\"11.0\" y2=\"11.0\"></line></svg> tonneau</span><br/><span class=\"lg2\">Grisé : on ne peut pas s'y tenir.</span></div><p class=\"pp\">Personnes : Bob, Pierre-Henri, Sophie, Odile</p><ol class=\"cl\"><li>Sophie se tenait juste à côté d'une plante.</li><li>Bob se tenait juste à côté d'une table.</li><li>Pierre-Henri et Bob se trouvaient dans la même pièce.</li></ol>\n<div class=\"q\"><b>Question :</b> Qui était assis dans l'escalier, près du départ des rampes, les yeux levés vers elles ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME T2</span><span>★</span></div>\n<h3>Le registre des pastilles</h3><p class=\"intro\">Yasmine Benali vous montre une page du registre de 1939, registre qu'elle a reconstitué. Quatre caisses voisines, quatre pastilles, quatre convois partis du Louvre. Remplissez le tableau avec des ✓ et des ✗.</p><div class=\"doc\"><div class=\"dh\">DÉPÔT DE CHAMBORD — REGISTRE DES CAISSES, 1939 (extrait reconstitué)</div><p class=\"small\">Pastilles : <b>●</b> jaune = très précieux · <b>◐</b> vert = œuvre majeure · <b>◉</b> une rouge = trésor mondial · <b>◉◉◉</b> trois rouges = trésor absolu. Chaque caisse porte un seul de ces quatre marquages.<br/>Convois : 28 août · 3 septembre · 15 septembre · 7 octobre.</p></div><table class=\"lg\"><tr><th></th><th class=\"v\"><div>jaune</div></th><th class=\"v\"><div>verte</div></th><th class=\"v\"><div>une rouge</div></th><th class=\"v\"><div>trois rouges</div></th><th class=\"v\"><div>28 août</div></th><th class=\"v\"><div>3 sept.</div></th><th class=\"v\"><div>15 sept.</div></th><th class=\"v\"><div>7 oct.</div></th></tr><tr><th class=\"h\">MN 1170</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1171</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1172</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1173</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr class=\"gt\"><th class=\"h\">28 août</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">3 sept.</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">15 sept.</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">7 oct.</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr></table><ol class=\"cl\"><li>MN 1170 porte une pastille jaune.</li><li>La caisse à la pastille verte est partie avec le dernier convoi.</li><li>MN 1171 est partie avant MN 1170.</li><li>La caisse aux trois pastilles rouges est partie avec le premier convoi.</li><li>MN 1173 porte trois pastilles rouges.</li></ol>\n<div class=\"q\"><b>Question :</b> Avec quel convoi la caisse MN 1173 a-t-elle quitté Paris ? Et quelle pastille porte MN 1172 ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.1</span><span>★</span></div>\n<h3>Ce que voit le légiste</h3><p class=\"intro\">Constatations dictées par le légiste de Blois, par téléphone, à 6 h 50.</p><div class=\"doc\"><div class=\"dh\">CONSTATATIONS — Laurent MARSAC, 58 ans</div><ul>\n<li>Corps sur la <b>rampe A</b>, entre le 1<sup>er</sup> et le 2<sup>e</sup> étage, <b>tête vers le bas</b>, 9 marches sous le palier du 2<sup>e</sup>.</li>\n<li>Nuque brisée. Décès probablement immédiat. Les talons ont laissé deux traînées sur le nez de la première marche sous le palier : <b>il est parti à la renverse, de dos</b>.</li>\n<li>Sur le revers de la veste, à hauteur de poitrine, <b>deux traces de poussière blanche, symétriques</b>, de la largeur d'une main. Le légiste demande de les photographier sans y toucher.</li>\n<li>Mains intactes, ongles propres, aucune écorchure : <b>il n'a pas tenté de se rattraper</b>.</li>\n<li>Lunettes : une branche manque. Elle est retrouvée sur le <b>palier du 2<sup>e</sup> étage, côté A</b>.</li>\n<li>Poches : clé de fer n° 1 (combles), stylo, mouchoir, un bâton de cire à cacheter rouge entamé, téléphone verrouillé.</li>\n</ul><p class=\"small\">Avis du légiste : « Quand on trébuche dans un escalier, on tombe en avant et on met les mains. »</p></div>\n<div class=\"q\"><b>Question :</b> Accident ou meurtre ? D'où Marsac est-il tombé, et comment ? Que signifient les deux traces blanches ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.2</span><span>★★</span></div>\n<h3>La mémoire des lampes</h3><p class=\"intro\">Relevé complet des détecteurs du grand escalier, de minuit à 6 h 30 (ensuite, tout le château accourt). D'autres petits escaliers de service relient les ailes entre elles ; ils ne sont pas équipés. Chaque palier (rez-de-chaussée, 1<sup>er</sup>, 2<sup>e</sup>, terrasses) a un détecteur de chaque côté : A et B. Une fois allumé, un côté de palier reste éclairé 10 minutes ; un nouveau passage pendant ces 10 minutes n'est pas enregistré. Marches non équipées, rampes dans le noir.</p><div class=\"doc mono\"><div class=\"dh\">RÉGIE — DÉTECTEURS ESCALIER — 25/09</div>\n<div class=\"two\"><table class=\"dt\"><tr><th>Heure</th><th>Palier</th><th>Côté</th></tr><tr><td>02 h 53</td><td>2<sup>e</sup> étage</td><td>A</td></tr><tr><td>04 h 12</td><td>2<sup>e</sup> étage</td><td>A</td></tr><tr><td>04 h 50</td><td>1<sup>er</sup> étage</td><td>A</td></tr><tr><td>04 h 51</td><td>Rez-de-chaussée</td><td>A</td></tr><tr><td>05 h 35</td><td>2<sup>e</sup> étage</td><td>A</td></tr><tr><td>05 h 36</td><td>1<sup>er</sup> étage</td><td>B</td></tr><tr><td>05 h 38</td><td>2<sup>e</sup> étage</td><td>B</td></tr><tr><td>05 h 46</td><td>Rez-de-chaussée</td><td>A</td></tr><tr><td>05 h 47</td><td>1<sup>er</sup> étage</td><td>B</td></tr></table><table class=\"dt\"><tr><th>Heure</th><th>Palier</th><th>Côté</th></tr><tr><td>05 h 48</td><td>1<sup>er</sup> étage</td><td>A</td></tr><tr><td>05 h 58</td><td>2<sup>e</sup> étage</td><td>B</td></tr><tr><td>05 h 59</td><td>Terrasses</td><td>B</td></tr><tr><td>06 h 19</td><td>2<sup>e</sup> étage</td><td>B</td></tr><tr><td>06 h 20</td><td>1<sup>er</sup> étage</td><td>B</td></tr><tr><td>06 h 21</td><td>Rez-de-chaussée</td><td>B</td></tr><tr><td>06 h 27</td><td>Rez-de-chaussée</td><td>A</td></tr><tr><td>06 h 29</td><td>1<sup>er</sup> étage</td><td>A</td></tr></table></div><table style=\"display:none\"></table></div>\n<div class=\"doc\"><div class=\"dh\">CARNET DE RONDE DE GILLES (extrait)</div><p class=\"small\">2 h 55 : réveillé par M. Marsac pour la clé n° 1 des combles.<br/>5 h 30 : début de ronde, aile des invités (2<sup>e</sup> étage ; le couloir des chambres débouche sur le palier du 2<sup>e</sup>, côté A ; ma chambre et la régie donnent directement sur l'aile, sans passer par le palier).<br/>5 h 34 : croisé M. Marsac sortant de sa chambre, habillé, une enveloppe cachetée de cire rouge à la main. Il allait vers l'escalier. Il ne m'a pas répondu.<br/>5 h 36 à 5 h 50 : lingerie et chambres du fond de l'aile (à 60 m du palier, derrière la porte coupe-feu).</p></div>\n<p class=\"note2\">Souvenez-vous du prologue : à quelle heure le cri qu'on a pris pour un brame s'est-il arrêté net ?</p>\n<div class=\"q\"><b>Question :</b> Entre quelles heures Marsac est-il tombé ? Donnez la fourchette la plus étroite possible, puis l'heure la plus probable.</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.3</span><span>★</span></div>\n<h3>Deux rampes, des paliers en commun</h3><p class=\"intro\">Coupe simplifiée de l'escalier à double révolution. Rampe A en trait plein, rampe B en pointillés. Elles tournent l'une autour de l'autre sans jamais se toucher. ✕ = le corps · ◆ = la branche de lunettes.</p><div class=\"fig\"><svg viewbox=\"0 0 330 300\" width=\"237.6pt\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect fill=\"#e3e3e3\" height=\"270\" width=\"24\" x=\"153\" y=\"10\"></rect><text font-size=\"8\" text-anchor=\"middle\" x=\"165\" y=\"295\">noyau ajouré</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"270\" y2=\"270\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"274\">RDC</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"265\">palier · côté A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"265\">côté B · palier</text><line stroke=\"  clé n° 3 dans la poche du commandant Lacombe. Clé n° 1 dans la poche de la victime (1.1). Clé n° 2 : <b>introuvable</b>. Sophie Kessler affirme l'avoir « perdue dans la soirée ».</p></div>\n<div class=\"q\"><b>Question :</b> Quelle clé Marsac a-t-il utilisée cette nuit ? Et quelle clé aurait pu ouvrir les combles à n'importe qui ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.5</span><span>★</span></div>\n<h3>L'inventaire de Camille</h3><p class=\"intro\">Camille sort de la mallette les instruments de son père. « Il scellait toujours ses conclusions dans une enveloppe, à la cire rouge, même provisoires. » Retrouvez-les dans la grille (dans les 8 directions), puis lisez dans l'ordre les lettres restantes.</p><table class=\"ws\"><tr><td>L</td><td>O</td><td>U</td><td>P</td><td>E</td><td>O</td><td>U</td><td>E</td><td>G</td></tr><tr><td>S</td><td>L</td><td>N</td><td>I</td><td>F</td><td>P</td><td>T</td><td>L</td><td>A</td></tr><tr><td>E</td><td>Y</td><td>O</td><td>N</td><td>L</td><td>I</td><td>S</td><td>I</td><td>N</td></tr><tr><td>U</td><td>T</td><td>T</td><td>C</td><td>A</td><td>P</td><td>P</td><td>U</td><td>T</td></tr><tr><td>A</td><td>S</td><td>O</td><td>E</td><td>C</td><td>E</td><td>A</td><td>T</td><td>S</td></tr><tr><td>E</td><td>N</td><td>C</td><td>A</td><td>O</td><td>T</td><td>T</td><td>E</td><td>E</td></tr><tr><td>C</td><td>V</td><td>E</td><td>U</td><td>N</td><td>T</td><td>U</td><td>L</td><td>R</td></tr><tr><td>S</td><td>C</td><td>A</td><td>L</td><td>P</td><td>E</td><td>L</td><td>O</td><td>I</td></tr><tr><td>P</td><td>P</td><td>L</td><td>A</td><td>M</td><td>P</td><td>E</td><td>E</td><td>C</td></tr></table><p class=\"words\">CIRE · COTON · ETUI · FLACON · GANTS · LAMPE · LOUPE · PINCEAU · PIPETTE · SCALPEL · SCEAU · SPATULE · STYLO</p>\n<div class=\"q\"><b>Question :</b> Quelle phrase forment les lettres restantes ? Que manque-t-il dans la mallette ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.6</span><span>★</span></div>\n<h3>Le carnet à l'envers</h3><p class=\"intro\">La dernière page du carnet de Laurent Marsac. Lisez-la dans un miroir, ou avec la caméra frontale d'un téléphone, qui inverse souvent l'image.</p><div class=\"carnet\"><div class=\"mirror\"><div>24/9 — Chambord.</div><div>DELAUNAY : pressée. Trop.</div><div>HASKELL : paiera. Combien ?</div><div>P.-H. V. : à surveiller. Toujours.</div><div>KESSLER : ses mains. Elle sait.</div><div>Caisse : demain 10 h.</div><div>Cheminée : toucher le joint. Cette nuit.</div></div></div>\n<div class=\"q\"><b>Question :</b> Qui Marsac jugeait-il « à surveiller » ? Et que voulait-il vérifier cette nuit-là ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.7</span><span>★★</span></div>\n<h3>Les chambres de l'aile</h3><p class=\"intro\">Les chambres du couloir de l'aile des invités (côté parc) : <b>2</b> Frêne · <b>4</b> Tilleul · <b>5</b> Hêtre · <b>7</b> Charme · <b>9</b> Chêne. L'aile des invités occupe le 2<sup>e</sup> étage. D'après les notes de ronde de Gilles, retrouvez qui dort où, et à quelle heure chacun a regagné sa chambre dans la nuit de jeudi à vendredi.</p><table class=\"lg\"><tr><th></th><th class=\"v\"><div>Frêne (2)</div></th><th class=\"v\"><div>Tilleul (4)</div></th><th class=\"v\"><div>Hêtre (5)</div></th><th class=\"v\"><div>Charme (7)</div></th><th class=\"v\"><div>Chêne (9)</div></th><th class=\"v\"><div>22 h 30</div></th><th class=\"v\"><div>23 h</div></th><th class=\"v\"><div>23 h 30</div></th><th class=\"v\"><div>minuit</div></th><th class=\"v\"><div>0 h 30</div></th></tr><tr><th class=\"h\">Marsac</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Camille</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Margaux</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Bob</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Pierre-Henri</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr class=\"gt\"><th class=\"h\">22 h 30</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">23 h</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">23 h 30</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">minuit</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">0 h 30</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr></table><ol class=\"cl\"><li>La personne rentrée la première dort dans la chambre au plus petit numéro.</li>\n<li>Camille est rentrée juste après Bob.</li>\n<li>La chambre Chêne est celle de la personne rentrée la dernière.</li>\n<li>Pierre-Henri dort dans une chambre au numéro impair, mais pas dans Charme.</li>\n<li>Marsac est rentré après minuit.</li>\n<li>La personne de la chambre Tilleul est rentrée juste avant celle de la chambre Chêne.</li>\n<li>Camille et son père occupent les chambres Charme et Chêne.</li></ol>\n<div class=\"q\"><b>Question :</b> Qui dort dans la chambre Tilleul ? Quel est le numéro de la chambre de Marsac ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.8</span><span>★</span></div>\n<h3>Le code du téléphone</h3><p class=\"intro\">« Il change de code à chaque expertise. Toujours le numéro de la caisse de l'œuvre, mais à l'envers, chiffre par chiffre, de droite à gauche. Comme il écrivait tout. » (Camille Marsac)</p><div class=\"phone\"><div class=\"scr\">🔒<br/>Saisissez le code<br/><span class=\"dots\">○ ○ ○ ○</span></div></div><p class=\"small\">Quand vous pensez avoir le code : <b>avec un ordinateur</b>, saisissez-le dans le terminal (onglet Téléphone). <b>Sans ordinateur</b>, ouvrez le <b>Coffre aux scellés</b>, en fin de livre, à l'entrée qui porte ce numéro. Une mauvaise entrée ne vous dira rien.</p>\n<div class=\"q\"><b>Question :</b> Quel est le code du téléphone de Marsac ? Que révèle-t-il ?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.9</span><span>★★</span></div>\n<h3>Deux personnes mentent</h3><p class=\"intro\">Les déclarations sur la fin de la nuit, vendredi. Le carnet de ronde de Gilles est fiable (ses heures sont confirmées par la pointeuse de la lingerie) ; le relevé du standard et celui des détecteurs (1.2) ne mentent pas. Vous aurez besoin des énigmes 1.2 et 1.7.</p><div class=\"doc\"><ul class=\"decl\">\n<li><b>Gilles (régisseur) :</b> « À 5 h 50, pendant ma ronde, la porte de la chambre 7 était entrouverte. J'ai frappé, puis allumé : personne, et le lit n'était pas défait. »</li>\n<li><b>Relevé du standard :</b> « Chambre 2 : appel sortant vers les États-Unis, de 5 h 10 à 5 h 32. »</li>\n<li><b>Camille :</b> « J'ai dormi d'une traite. Je n'ai rien entendu avant le cri de Yasmine. »</li>\n<li><b>Bob :</b> « J'ai dormi comme un bébé jusqu'au cri. Le décalage horaire. »</li>\n<li><b>Thomas :</b> « De 5 h à 6 h, je faisais ma ronde dans le parc, sur la digue du Cosson. »</li>\n<li><b>Yasmine :</b> « Je me suis levée à 6 h 15 pour travailler sur le registre, puis je suis descendue chercher un café. »</li>\n<li><b>Nathan :</b> « À 6 h, j'étais déjà sur la terrasse pour préparer le drone. »</li></ul></div>\n<div class=\"q\"><b>Question :</b> Quelles sont les deux personnes qui mentent ? Prouvez-le.</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>ÉNIGME 1.10</span><span>★★</span></div>\n<h3>Ce qu'a vu Odile</h3><p class=\"intro\">Le récit d'Odile Ferrand, puis ce que vous avez trouvé sur les marches avec votre lampe. ● = traces de poussière blanche (de la chaux, comme dans les combles). O = Odile à 5 h 47.</p><div class=\"doc\"><p class=\"small\">« J'étais descendue un peu avant 5 heures chercher mon châle, oublié l'après-midi près du feu du rez-de-chaussée, et je m'étais assoupie. Vers 5 h 40, un cri m'a réveillée, comme un cerf, mais pas tout à fait. Quelques minutes plus tard, je remontais vers ma chambre, au 1<sup>er</sup>, par la rampe A. Lentement : j'ai quatre-vingt-quatre ans. À travers les ouvertures, j'ai vu quelqu'un descendre <b>de l'autre côté</b>, au-dessus de moi, vite, sans lumière. Quand je suis arrivée au palier du 1<sup>er</sup>, il n'y avait plus personne. Une porte venait de se refermer. Je n'ai pas vu de visage. » (Odile Ferrand)</p></div>\n<div class=\"fig\"><svg viewbox=\"0 0 330 300\" width=\"237.6pt\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect fill=\"#e3e3e3\" height=\"270\" width=\"24\" x=\"153\" y=\"10\"></rect><text font-size=\"8\" text-anchor=\"middle\" x=\"165\" y=\"295\">noyau ajouré</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"270\" y2=\"270\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"274\">RDC</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"265\">palier · côté A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"265\">côté B · palier</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"175\" y2=\"175\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"179\">1er étage</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"170\">palier · côté A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"170\">côté B · palier</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"80\" y2=\"80\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"84\">2e étage</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"75\">palier  document. Relisez lentement. » Code refusé.", "Le silence retombe sur la régie. Lacombe pose le doigt sur vos notes : « Une de vos réponses est fausse. Vérifiez-la. » Code refusé.", "La lampe de la régie grésille, puis se stabilise. « Le château ne ment pas, lieutenant. Ce sont nos lectures qui se trompent. » Code refusé.", "Lacombe regarde le lac qui a remplacé le parc. « Patience. Reprenez chaque énigme du jour. La réponse est déjà sur la table. » Code refusé."]}, "en": {"ui": {"title": "Investigation Terminal", "sub": "OCBC · The Marsac Case · Chambord Castle", "tabs": ["Home", "Codes", "Phone", "Case Files", "Theory"], "home": "<p>Lieutenant, this terminal goes with the book. It is <b>optional</b>: everything can be played on paper.</p>\n<ul><li><b>Codes</b>: at the end of each day, enter the four-digit code. A correct code opens the next day's case file.</li>\n<li><b>Phone</b>: Laurent Marsac's phone, locked. The code is found on Day 1.</li>\n<li><b>Case Files</b>: each day's documents in large format, to examine on screen.</li>\n<li><b>Theory</b>: after the final code, score your theory out of 100, then read the Resolution.</li></ul>\n<p class=\"warn\">Only enter a code when the book asks you to: a file opened too early would spoil the investigation.</p>", "codeask": "Enter a four-digit code", "ok": "Submit", "bad4": "A code has four digits.", "phonelock": "Enter passcode", "locked": "Locked file · Day {d} code", "day": "Day", "open": "Open", "theorylock": "Available after the final Day 4 code.", "score": "Your score", "scorehelp": "For each line, choose what your theory really contained. Be honest: no one is watching.", "reveal": "Read the Resolution", "unlocked": "Open", "nocrypto": "This browser cannot decrypt the files. Please try a recent Chrome, Edge, Firefox or Safari.", "reset": "Erase my progress", "resetq": "Erase every opened file on this device?", "wait": "Checking…", "lang": "Français"}, "d1": "<section class=\"enigme scr\"><div class=\"eh\"><spa middle\" viewbox=\"0 0 22 22\" width=\"14pt\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#c9c9c9\" height=\"19\" width=\"19\" x=\"1.5\" y=\"1.5\"></rect><circle cx=\"11.0\" cy=\"11.0\" fill=\"#fff\" r=\"5.5440000000000005\" stroke=\"#000\" stroke-width=\"1.4\"></circle><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"16.544\" y1=\"11.0\" y2=\"11.0\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"13.772000000000002\" y1=\"11.0\" y2=\"15.801244838580928\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"8.228000000000002\" y1=\"11.0\" y2=\"15.801244838580928\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"5.4559999999999995\" y1=\"11.0\" y2=\"11.0\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"8.227999999999998\" y1=\"11.0\" y2=\"6.198755161419074\"></line><line stroke=\"#000\" stroke-width=\"1\" x1=\"11.0\" x2=\"13.772000000000002\" y1=\"11.0\" y2=\"6.198755161419072\"></line></svg> plant</span> <span class=\"li\"><svg style=\"display:inline-block;vertical-align:middle\" viewbox=\"0 0 22 22\" width=\"14pt\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#c9c9c9\" height=\"19\" width=\"19\" x=\"1.5\" y=\"1.5\"></rect><rect fill=\"#fff\" height=\"9.856000000000002\" stroke=\"#000\" stroke-width=\"1.4\" width=\"14.783999999999999\" x=\"3.6080000000000005\" y=\"6.071999999999999\"></rect></svg> table</span> <span class=\"li\"><svg style=\"display:inline-block;vertical-align:middle\" viewbox=\"0 0 22 22\" width=\"14pt\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#c9c9c9\" height=\"19\" width=\"19\" x=\"1.5\" y=\"1.5\"></rect><ellipse cx=\"11.0\" cy=\"11.0\" fill=\"#fff\" rx=\"6.16\" ry=\"7.084\" stroke=\"#000\" stroke-width=\"1.4\"></ellipse><line stroke=\"#000\" x1=\"4.84\" x2=\"17.16\" y1=\"11.0\" y2=\"11.0\"></line></svg> barrel</span><br/><span class=\"lg2\">Grey: no one can stand there.</span></div><p class=\"pp\">People: Bob, Pierre-Henri, Sophie, Odile</p><ol class=\"cl\"><li>Sophie was standing right next to a plant.</li><li>Bob was standing right next to a table.</li><li>Pierre-Henri and Bob were in the same room.</li></ol>\n<div class=\"q\"><b>Question:</b> Who was sitting by the staircase, near the foot of the two flights, gazing up at them?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE T2</span><span>★</span></div>\n<h3>The Register of Dots</h3><p class=\"intro\">Yasmine Benali shows you a page from the 1939 register, a register she has painstakingly pieced back together. Four neighboring crates, four markings, four convoys out of the Louvre. Fill in the grid with ✓ and ✗.</p><div class=\"doc\"><div class=\"dh\">CHAMBORD DEPOT — CRATE REGISTER, 1939 (reconstructed excerpt)</div><p class=\"small\">Dots: <b>●</b> yellow = very valuable · <b>◐</b> green = major work · <b>◉</b> one red = world treasure · <b>◉◉◉</b> three red = supreme treasure. Each crate bears only one of these four markings.<br/>Convoys: August 28 · September 3 · September 15 · October 7.</p></div><table class=\"lg\"><tr><th></th><th class=\"v\"><div>yellow</div></th><th class=\"v\"><div>green</div></th><th class=\"v\"><div>one red</div></th><th class=\"v\"><div>three red</div></th><th class=\"v\"><div>Aug. 28</div></th><th class=\"v\"><div>Sept. 3</div></th><th class=\"v\"><div>Sept. 15</div></th><th class=\"v\"><div>Oct. 7</div></th></tr><tr><th class=\"h\">MN 1170</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1171</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1172</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr><th class=\"h\">MN 1173</th><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td></tr><tr class=\"gt\"><th class=\"h\">Aug. 28</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">Sept. 3</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">Sept. 15</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr><tr><th class=\"h\">Oct. 7</th><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"4\"></td></tr></table><ol class=\"cl\"><li>MN 1170 bears a yellow dot.</li><li>The crate with the green dot left with the last convoy.</li><li>MN 1171 left before MN 1170.</li><li>The crate with three red dots left with the first convoy.</li><li>MN 1173 bears three red dots.</li></ol>\n<div class=\"q\"><b>Question:</b> With which convoy did crate MN 1173 leave Paris? And which dot does MN 1172 bear?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.1</span><span>★</span></div>\n<h3>What the Medical Examiner Sees</h3><p class=\"intro\">Findings dictated by the Blois medical examiner, over the phone, at 6:50 a.m.</p><div class=\"doc\"><div class=\"dh\">FINDINGS — Laurent Marsac, 58</div><ul>\n<li>Body on <b>flight A</b>, between the 1st and 2nd floors, <b>head down</b>, 9 steps below the 2nd-floor landing.</li>\n<li>Neck broken. Death probably instantaneous. The heels left two scuff marks on the nosing of the first step below the landing: <b>he went over backward</b>.</li>\n<li>On the lapels of the jacket, at chest height, <b>two marks of white dust, symmetrical</b>, each the width of a hand. The examiner asks for them to be photographed without being touched.</li>\n<li>Hands intact, nails clean, not a scrape: <b>he did not try to catch himself</b>.</li>\n<li>Glasses: one temple arm is missing. It is found on the <b>2nd-floor landing, side A</b>.</li>\n<li>Pockets: iron key no. 1 (attic), pen, handkerchief, a half-used stick of red sealing wax, locked phone.</li>\n</ul><p class=\"small\">The examiner’s opinion: “When you trip on a staircase, you fall forward and put your hands out.”</p></div>\n<div class=\"q\"><b>Question:</b> Accident or murder? Where did Marsac fall from, and how? What do the two white marks mean?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.2</span><span>★★</span></div>\n<h3>What the Lights Remember</h3><p class=\"intro\">The full log of the main staircase’s detectors, from midnight to 6:30 a.m. (after that, the whole château comes running). Other small service stairs link the wings to one another; they have no detectors. Each landing (ground, 1st, 2nd, roof terraces; European numbering, so the 1st floor is one flight up) has one detector on each side: A and B. Once triggered, a side of a landing stays lit for 10 minutes; any new passage during those 10 minutes is not recorded. No detectors on the steps; the flights are dark at night.</p><div class=\"doc mono\"><div class=\"dh\">CONTROL ROOM — STAIRCASE DETECTORS — 09/25</div>\n<div class=\"two\"><table class=\"dt\"><tr><th>Time</th><th>Landing</th><th>Side</th></tr><tr><td>02:53</td><td>2nd floor</td><td>A</td></tr><tr><td>04:12</td><td>2nd floor</td><td>A</td></tr><tr><td>04:50</td><td>1st floor</td><td>A</td></tr><tr><td>04:51</td><td>Ground</td><td>A</td></tr><tr><td>05:35</td><td>2nd floor</td><td>A</td></tr><tr><td>05:36</td><td>1st floor</td><td>B</td></tr><tr><td>05:38</td><td>2nd floor</td><td>B</td></tr><tr><td>05:46</td><td>Ground</td><td>A</td></tr><tr><td>05:47</td><td>1st floor</td><td>B</td></tr></table><table class=\"dt\"><tr><th>Time</th><th>Landing</th><th>Side</th></tr><tr><td>05:48</td><td>1st floor</td><td>A</td></tr><tr><td>05:58</td><td>2nd floor</td><td>B</td></tr><tr><td>05:59</td><td>Terraces</td><td>B</td></tr><tr><td>06:19</td><td>2nd floor</td><td>B</td></tr><tr><td>06:20</td><td>1st floor</td><td>B</td></tr><tr><td>06:21</td><td>Ground</td><td>B</td></tr><tr><td>06:27</td><td>Ground</td><td>A</td></tr><tr><td>06:29</td><td>1st floor</td><td>A</td></tr></table></div></div>\n<div class=\"doc\"><div class=\"dh\">GILLES’S ROUNDS NOTEBOOK (excerpt)</div><p class=\"small\">2:55 a.m.: woken by Mr. Marsac for attic key no. 1.<br/>5:30: rounds begin, guest wing (2nd floor; the bedroom corridor opens onto the 2nd-floor landing, side A; my room and the control room open directly onto the wing, without going through the landing).<br/>5:34: passed Mr. Marsac coming out of his room, dressed, holding an envelope sealed with red wax. He was heading for the staircase. He didn’t answer me.<br/>5:36 to 5:50: linen room and the bedrooms at the far end of the wing (60 m from the landing, behind the fire door).</p></div>\n<p class=\"note2\">Remember the prologue: at what time did the cry everyone took for a stag’s bellow stop dead?</p>\n<div class=\"q\"><b>Question:</b> Between what times did Marsac fall? Give the narrowest possible window, then the most likely time.</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.3</span><span>★</span></div>\n<h3>Two Flights, Shared Landings</h3><p class=\"intro\">A simplified cross-section of the double-helix staircase. Flight A is drawn as a solid line, flight B as a dashed one. They wind around each other without ever touching. ✕ = the body · ◆ = the arm of the glasses.</p><div class=\"fig\"><svg viewbox=\"0 0 330 300\" width=\"237.6pt\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect fill=\"#e3e3e3\" height=\"270\" width=\"24\" x=\"153\" y=\"10\"></rect><text font-size=\"8\" text-anchor=\"middle\" x=\"165\" y=\"295\">open core</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"270\" y2=\"270\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"274\">Ground</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"265\">landing · side A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"265\">side B · landing</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"175\" y2=\"175\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" 35.0,20.0\" stroke=\"#000\" stroke-dasharray=\"5 3\" stroke-width=\"2\"></polyline><text font-size=\"10\" font-weight=\"bold\" x=\"73\" y=\"252\">A</text><text font-size=\"10\" font-weight=\"bold\" x=\"251\" y=\"252\">B</text><text font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"194.80455040955505\" y=\"115.39999999999999\">✕</text><text font-size=\"12\" text-anchor=\"middle\" x=\"83\" y=\"93\">◆</text></svg></div><p class=\"small\">Note: in this cross-section, the flights seem to cross in the middle. In reality, they turn one behind the other, separated by the core.</p>\n<div class=\"q\"><b>Question:</b> Where was the person who pushed Marsac standing? Why could they not have been anywhere else?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.4</span><span>★</span></div>\n<h3>The Key Register</h3><p class=\"intro\">The logbook on the lectern, on the 2nd-floor landing, at the foot of the little attic stairs. There are only three keys. Returned keys are kept in the estate manager’s locked box; at night, to take one out, you have to wake Gilles, whose room opens onto the wing, very close by.</p><div class=\"doc mono\"><div class=\"dh\">KEY REGISTER — ATTIC</div>\n<table class=\"dt\"><tr><th>Day</th><th>Time</th><th>Key</th><th>Movement</th><th>Signature</th></tr>\n<tr><td>Thu</td><td>6:10 p.m.</td><td>no. 1</td><td>out</td><td>Margaux D.</td></tr>\n<tr><td>Thu</td><td>8:05 p.m.</td><td>no. 2</td><td>out</td><td>S. Kessler</td></tr>\n<tr><td>Thu</td><td>10:40 p.m.</td><td>no. 3</td><td>out</td><td>OCBC (Lacombe)</td></tr>\n<tr><td>Thu</td><td>11:50 p.m.</td><td>no. 1</td><td>returned</td><td>Margaux D.</td></tr>\n<tr><td>Fri</td><td>2:55 a.m.</td><td>no. 1</td><td>out</td><td>L. Marsac (Gilles woken)</td></tr>\n</table>\n<p class=\"small\">Check at 8:10 a.m.: key no. 3 in Commander Lacombe’s pocket. Key no. 1 in the victim’s pocket (1.1). Key no. 2: <b>missing</b>. Sophie Kessler says she “lost it sometime during the evening.”</p></div>\n<div class=\"q\"><b>Question:</b> Which key did Marsac use last night? And which key could have opened the attic to anyone at all?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.5</span><span>★</span></div>\n<h3>Camille’s Inventory</h3><p class=\"intro\">Camille takes her father’s instruments out of the case. “He always sealed his conclusions in an envelope, with red wax, even the preliminary ones.” Find them in the grid (in all 8 directions), then read the leftover letters in order.</p><table class=\"ws\"><tr><td>W</td><td>H</td><td>T</td><td>E</td><td>S</td><td>P</td><td>N</td><td>R</td><td>E</td></tr><tr><td>I</td><td>S</td><td>W</td><td>E</td><td>P</td><td>E</td><td>O</td><td>T</td><td>H</td></tr><tr><td>L</td><td>P</td><td>E</td><td>T</td><td>A</td><td>N</td><td>T</td><td>E</td><td>L</td></tr><tr><td>O</td><td>M</td><td>E</td><td>T</td><td>T</td><td>K</td><td>T</td><td>E</td><td>A</td></tr><tr><td>U</td><td>A</td><td>Z</td><td>E</td><td>U</td><td>S</td><td>O</td><td>H</td><td>E</td></tr><tr><td>P</td><td>L</td><td>E</td><td>P</td><td>L</td><td>A</td><td>C</td><td>S</td><td>S</td></tr><tr><td>E</td><td>N</td><td>R</td><td>I</td><td>A</td><td>L</td><td>V</td><td>U</td><td>W</td></tr><tr><td>E</td><td>L</td><td>S</td><td>P</td><td>O</td><td>F</td><td>P</td><td>R</td><td>A</td></tr><tr><td>G</td><td>L</td><td>O</td><td>V</td><td>E</td><td>S</td><td>E</td><td>B</td><td>X</td></tr></table><p class=\"words\">BRUSH · COTTON · FLASK · GLOVES · LAMP · LOUPE · PEN · PIPETTE · SCALPEL · SEAL · SPATULA · TWEEZERS · WAX</p>\n<div class=\"q\"><b>Question:</b> What sentence do the leftover letters spell? What is missing from the case?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.6</span><span>★</span></div>\n<h3>The Backward Notebook</h3><p class=\"intro\">The last page of Laurent Marsac’s notebook. Read it in a mirror, or with a phone’s front camera, which often flips the image.</p><div class=\"carnet\"><div class=\"mirror\"><div>9/24 — Chambord.</div><div>DELAUNAY: in a hurry. Too much.</div><div>HASKELL: will pay. How much?</div><div>P.H.V.: keep an eye on him. Always.</div><div>KESSLER: her hands. She knows.</div><div>Crate: tomorrow 10 a.m.</div><div>Chimney: touch the joint. Tonight.</div></div></div>\n<div class=\"q\"><b>Question:</b> Whom did Marsac think he had to “keep an eye on”? And what did he want to check that night?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.7</span><span>★★</span></div>\n<h3>The Rooms in the Wing</h3><p class=\"intro\">The bedrooms along the guest-wing corridor (grounds side): <b>2</b> Ash · <b>4</b> Linden · <b>5</b> Beech · <b>7</b> Hornbeam · <b>9</b> Oak. The guest wing occupies the 2nd floor. Using Gilles’s rounds notes, work out who sleeps where, and what time each person went back to their room on Thursday night.</p><table class=\"lg\"><tr><th></th><th class=\"v\"><div>Ash (2)</div></th><th class=\"v\"><div>Linden (4)</div></th><th class=\"v\"><div>Beech (5)</div></th><th class=\"v\"><div>Hornbeam (7)</div></th><th class=\"v\"><div>Oak (9)</div></th><th class=\"v\"><div>10:30 p.m.</div></th><th class=\"v\"><div>11 p.m.</div></th><th class=\"v\"><div>11:30 p.m.</div></th><th class=\"v\"><div>midnight</div></th><th class=\"v\"><div>12:30 a.m.</div></th></tr><tr><th class=\"h\">Marsac</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Camille</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Margaux</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Bob</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr><th class=\"h\">Pierre-Henri</th><td></td><td></td><td></td><td></td><td></td><td class=\"gs\"></td><td></td><td></td><td></td><td></td></tr><tr class=\"gt\"><th class=\"h\">10:30 p.m.</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">11 p.m.</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">11:30 p.m.</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">midnight</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr><tr><th class=\"h\">12:30 a.m.</th><td></td><td></td><td></td><td></td><td></td><td class=\"none\" colspan=\"5\"></td></tr></table><ol class=\"cl\"><li>The person who came back first sleeps in the room with the lowest number.</li>\n<li>Camille came back right after Bob.</li>\n<li>The Oak room belongs to the person who came back last.</li>\n<li>Pierre-Henri sleeps in an odd-numbered room, but not in Hornbeam.</li>\n<li>Marsac came back after midnight.</li>\n<li>The person in the Linden room came back right before the person in the Oak room.</li>\n<li>Camille and her father have the Hornbeam and Oak rooms.</li></ol>\n<div class=\"q\"><b>Question:</b> Who sleeps in the Linden room? What is the number of Marsac’s room?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.8</span><span>★</span></div>\n<h3>The Phone Code</h3><p class=\"intro\">“He changes the code for every appraisal. Always the number of the artwork’s crate, but backward, digit by digit, right to left. The way he wrote everything.” (Camille Marsac)</p><div class=\"phone\"><div class=\"scr\">🔒<br/>Enter passcode<br/><span class=\"dots\">○ ○ ○ ○</span></div></div><p class=\"small\">When you think you have the code: <b>with a computer</b>, enter it in the investigation terminal (Phone tab). <b>Without a computer</b>, open <b>The Sealed Vault</b> at the back of the book, at the entry bearing that number. A wrong entry will tell you nothing.</p>\n<div class=\"q\"><b>Question:</b> What is the code to Marsac’s phone? What does it reveal?</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.9</span><span>★★</span></div>\n<h3>Two People Are Lying</h3><p class=\"intro\">Statements about the end of the night, Friday. Gilles’s rounds notebook is reliable (his times are confirmed by the time clock in the linen room); the switchboard log and the detector log (1.2) don’t lie. You will need puzzles 1.2 and 1.7.</p><div class=\"doc\"><ul class=\"decl\">\n<li><b>Gilles (estate manager):</b> “At 5:50, during my rounds, the door to room 7 was ajar. I knocked, then switched on the light: nobody there, and the bed hadn’t been slept in.”</li>\n<li><b>Switchboard log:</b> “Room 2: outgoing call to the United States, from 5:10 to 5:32 a.m.”</li>\n<li><b>Camille:</b> “I slept straight through. I didn’t hear a thing before Yasmine screamed.”</li>\n<li><b>Bob:</b> “Slept like a baby till the scream. Jet lag.”</li>\n<li><b>Thomas:</b> “From five to six, I was making my rounds in the grounds, on the Cosson embankment.”</li>\n<li><b>Yasmine:</b> “I got up at 6:15 to work on the register, then went down to get a coffee.”</li>\n<li><b>Nathan:</b> “At six, I was already up on the terrace, getting the drone ready.”</li></ul></div>\n<div class=\"q\"><b>Question:</b> Which two people are lying? Prove it.</div></section><section class=\"enigme scr\"><div class=\"eh\"><span>PUZZLE 1.10</span><span>★★</span></div>\n<h3>What Odile Saw</h3><p class=\"intro\">Odile Ferrand’s account, then what you found on the steps with your flashlight. ● = marks of white dust (lime, like the dust in the attic). O = Odile at 5:47 a.m.</p><div class=\"doc\"><p class=\"small\">“I’d gone down a little before five to fetch my shawl, which I’d left by the fire on the ground floor that afternoon, and I dozed off. Around 5:40, a cry woke me, like a stag, but not quite. A few minutes later, I was climbing back up to my room, on the first floor, by flight A. Slowly: I’m eighty-four. Through the openings, I saw someone coming down <b>on the other side</b>, above me, fast, without a light. When I reached the first-floor landing, there was no one. A door had just closed. I never saw a face.” (Odile Ferrand)</p></div>\n<div class=\"fig\"><svg viewbox=\"0 0 330 300\" width=\"237.6pt\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect fill=\"#e3e3e3\" height=\"270\" width=\"24\" x=\"153\" y=\"10\"></rect><text font-size=\"8\" text-anchor=\"middle\" x=\"165\" y=\"295\">open core</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"270\" y2=\"270\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"274\">Ground</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"265\">landing · side A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"265\">side B · landing</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"175\" y2=\"175\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"179\">1st floor</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"170\">landing · side A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"170\">side B · landing</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"80\" y2=\"80\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"84\">2nd floor</text><text font-size=\"7.5\" text-anchor=\"start\" x=\"65\" y=\"75\">landing · side A</text><text font-size=\"7.5\" text-anchor=\"end\" x=\"265\" y=\"75\">side B · landing</text><line stroke=\"#000\" stroke-width=\"3\" x1=\"67\" x2=\"263\" y1=\"20\" y2=\"20\"></line><text font-size=\"9\" font-weight=\"bold\" x=\"8\" y=\"24\">Terraces</text><polyline fill=\"none\" points=\"95.0,270.0 95.9,267.6 98.4,265.2 102.6,262.9 108.4,260.5 115.5,258.1 123.9,255.8 133.2,253.4 143.4,251.0 154.0,248.6 165.0,246.2 176.0,243.9 186.6,241.5 196.8,239.1 206.1,23 const ITER=120000;
const KEYS=['d2','d3','d4','fin','phone'];
let lang='fr', tab=0, store={fr:{},en:{}}, plain={fr:{},en:{}};
function sget(){try{const s=JSON.parse(localStorage.getItem('chambord_term')||'null');if(s){store=Object.assign({fr:{},en:{}},s.store||{});lang=s.lang||lang;}}catch(e){}}
function sset(){try{localStorage.setItem('chambord_term',JSON.stringify({store,lang}))}catch(e){}}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(code,blob){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.s),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.i)},key,b64(blob.c));
 return JSON.parse(new TextDecoder().decode(pt));
}
async function tryAll(code,keys){
 const L=DATA[lang].locked;
 for(const k of keys){ if(!L[k])continue; try{const o=await decrypt(code,L[k]);return [k,o];}catch(e){} }
 return null;
}
async function restore(){
 for(const lg of ['fr','en']) for(const k in store[lg]){
  try{plain[lg][k]=await decrypt(store[lg][k],DATA[lg].locked[k]);}catch(e){delete store[lg][k];}
 }
}
const U=()=>DATA[lang].ui;
function render(){
 const u=U(); document.documentElement.lang=lang;
 t.textContent=u.title; st.textContent=u.sub; lg.textContent=u.lang; rst.textContent=u.reset;
 nav.innerHTML=u.tabs.map((x,i)=>`<button class="${i==tab?'on':''}" data-i="${i}">${x}</button>`).join('');
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render();});
 for(let i=0;i<5;i++) document.getElementById('v'+i).classList.toggle('on',i==tab);
 home.innerHTML=u.home; ask.textContent=u.codeask; go.textContent=u.ok;
 renderPhone(); renderDays(); renderTheory();
}
function fail(){const f=DATA[lang].fails;return f[Math.floor(Math.random()*f.length)];}
async function submitCode(){
 const c=code.value.trim(); cmsg.className='msg';
 if(!/^\d{4}$/.test(c)){cmsg.textContent=U().bad4;cmsg.classList.add('bad');return;}
 cmsg.textContent=U().wait;
 const r=await tryAll(c,KEYS);
 if(!r){cmsg.innerHTML=fail();cmsg.classList.add('bad');return;}
 const [k,o]=r; store[lang][k]=c; plain[lang][k]=o; sset();
 cmsg.innerHTML=o.msg; cmsg.classList.add('ok'); code.value='';
 renderPhone(); renderDays(); renderTheory();
}
function renderPhone(){
 const u=U(), o=plain[lang].phone;
 if(!o){
  pscr.style.justifyContent='center'; pscr.innerHTML=`<div style="font-size:2.2rem">🔒</div><div class="meta">${u.phonelock}</div><input id="pc" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" id="pgo">${u.ok}</button><div class="meta" id="pm"></div>`;
  const go2=async()=>{const c=pc.value.trim(); if(!/^\d{4}$/.test(c)){pm.textContent=u.bad4;return;} pm.textContent=u.wait;
   const r=await tryAll(c,['phone']); if(!r){pm.innerHTML=fail();pc.value='';return;}
   store[lang].phone=c; plain[lang].phone=r[1]; sset(); renderPhone();};
  pgo.onclick=go2; pc.onkeydown=e=>{if(e.key==='Enter')go2();};
 } else {
  const m=o.sms; pscr.style.justifyContent='flex-start';
  pscr.innerHTML=`<div class="thread"><div class="meta" style="text-align:center;font-size:.9rem;color:#ddd">${m.num}</div><div class="meta" style="text-align:center">${m.out[0]}</div><div class="bubble">${m.out[1]}</div><div class="meta" style="text-align:center">${m.in[0]}</div><div class="bubble in">${m.in[1]}</div><div class="meta" style="margin-top:18px;font-style:italic;text-align:center">${m.note}</div></div>`;
 }
}
function frame(html){
 const doc=`<!doctype html><html><head><meta charset="utf-8"><style>${BOOKCSS}
 html,body{background:#fff;margin:0}body{padding:18px 16px;max-width:640px;margin:0 auto;font-size:15px}
 section{page-break-before:auto!important;break-before:auto!important;border-bottom:1px solid #bbb;padding-bottom:22px;margin-bottom:22px}
 svg{max-width:100%;height:auto}img{max-width:100%}.go{display:none}</style></head><body>${html}</body></html>`;
 const f=document.createElement('iframe'); f.className='doss'; f.setAttribute('sandbox','allow-same-origin'); f.srcdoc=doc;
 f.onload=()=>{const fit=()=>{try{f.style.height=(f.contentDocument.documentElement.scrollHeight+4)+'px';}catch(e){f.style.height='80vh';}};fit();setTimeout(fit,300);};
 return f;
}
let openDay=null;
function renderDays(){
 const u=U(), P=plain[lang];
 const items=[[1,DATA[lang].d1],[2,P.d2&&P.d2.html],[3,P.d3&&P.d3.html],[4,P.d4&&P.d4.html]];
 days.innerHTML=items.map(([d,h])=>`<div class="dayrow ${h?'open':''}"><div><b>${u.day} ${d}</b><div class="st">${h?u.unlocked:u.locked.replace('{d}',d-1)}</div></div>${h?`<button class="btn ghost" data-d="${d}">${u.open}</button>`:''}</div>`).join('');
 days.querySelectorAll('button').forEach(b=>b.onclick=()=>{openDay=+b.dataset.d;showDay();});
 showDay();
}
function showDay(){
 dview.innerHTML=''; if(!openDay)return;
 const P=plain[lang]; const h=openDay==1?DATA[lang].d1:(P['d'+openDay]&&P['d'+openDay].html);
 if(h) dview.appendChild(frame(h));
}
function renderTheory(){
 const u=U(), o=plain[lang].fin;
 if(!o){theory.innerHTML=`<div class="card small">${u.theorylock}</div>`;return;}
 const rows=o.grid.rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}<br><select data-i="${i}">${o.steps[i].map(v=>`<option value="${v}">${v} / ${r[2]}</option>`).join('')}</select></td></tr>`).join('');
 theory.innerHTML=`<div class="card"><p class="small">${u.scorehelp}</p><table class="grid">${rows}</table><div class="total" id="tot">0 / 100</div><div class="small">${o.grid.notes}</div></div><div class="card" style="text-align:center"><button class="btn" id="rev">${u.reveal}</button></div><div id="recv"></div>`;
 const upd=()=>{let s=0;theory.querySelectorAll('select').forEach(x=>s+=+x.value);tot.textContent=s+' / 100';};
 theory.querySelectorAll('select').forEach(x=>x.onchange=upd);
 rev.onclick=()=>{recv.innerHTML='';recv.appendChild(frame(o.rec));rev.parentElement.style.display='none';};
}
lg.onclick=()=>{lang=lang==='fr'?'en':'fr';openDay=null;cmsg.textContent='';sset();render();};
go.onclick=submitCode; code.onkeydown=e=>{if(e.key==='Enter')submitCode();};
rst.onclick=()=>{if(confirm(U().resetq)){store={fr:{},en:{}};plain={fr:{},en:{}};sset();openDay=null;render();}};
(async()=>{
 sget();
 const q=new URLSearchParams(location.search).get('lang'); if(q==='en'||q==='fr')lang=q;
 else if(!localStorage.getItem||1){ /* keep stored or default */ }
 if(!(window.crypto&&crypto.subtle)){document.querySelector('main').innerHTML=`<div class="card warn">${DATA[lang].ui.nocrypto}</div>`;return;}
 await restore(); render();
})();
</script>
